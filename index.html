<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Taste of Somali Logo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: app header, a large stage with brand combinations under it, and an inspector column. Single dark espresso theme taken from the brand palette. */
:root{
  color-scheme:dark;
  --bg:#120b07; --surface:#1b110c; --raised:#251811; --hover:#2f1f16;
  --line:rgba(233,216,181,.11); --line-strong:rgba(233,216,181,.24);
  --ivory:#faf4e9; --text:#efe4d3; --muted:#a8937f;
  --gold:#c6a15b; --gold-soft:#dfc995; --on-gold:#1d1008;
  --warn:#e08a6c;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:500 13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{margin:0;font:600 19px/1.2 var(--serif);color:var(--ivory);letter-spacing:.01em}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}

.shell{min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#1d120c,#150d08)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--gold);padding:3px}
.brand b{display:block;font:700 22px/1 var(--serif);color:var(--ivory);white-space:nowrap}
.brand span{display:block;margin-top:5px;color:var(--gold);white-space:nowrap}
.actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;white-space:nowrap;border-radius:10px;border:1px solid var(--line-strong);font-weight:600;transition:background .2s,border-color .2s,transform .1s}
.btn:not(:disabled):hover{background:var(--hover);border-color:var(--gold)}
.btn:not(:disabled):active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,#d9bd7c,#b9924c);border-color:#d9bd7c;color:var(--on-gold)}
.btn.gold:hover{background:linear-gradient(180deg,#e6cd91,#c6a15b)}
.btn.icon{width:36px;padding:0}
#reset{gap:4px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 396px;min-height:0}
.stagecol{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(ellipse 80% 60% at 50% 42%,#2a1a12 0%,var(--bg) 100%)}
.viewer{flex:1;display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 20px 0}
.meters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter i{width:7px;height:7px;border-radius:50%;background:#9fb36a}
.meter.low{color:var(--warn);border-color:rgba(224,138,108,.4)}
.meter.low i{background:var(--warn)}
.meter b{color:var(--text);font-weight:700}
.frame{flex:1;container-type:size;display:grid;place-items:center;min-height:300px;margin:14px 20px;position:relative}
.paper{width:min(100cqw,100cqh);aspect-ratio:1;border-radius:22px;display:grid;place-items:center;padding:4.5%;box-shadow:0 30px 80px -20px rgba(0,0,0,.75),0 0 0 1px var(--line-strong);transition:background-color .35s var(--ease)}
.paper svg{display:block;width:100%;height:100%;animation:rise .7s var(--ease) both}
.paper.settled svg{animation:none}
@keyframes rise{from{opacity:0;transform:scale(.95) rotate(-5deg)}to{opacity:1;transform:none}}
[data-part]{transition:fill .3s var(--ease),opacity .25s}
.paper [data-part]{cursor:pointer}
.paper .pulse{animation:pulse .9s var(--ease)}
@keyframes pulse{35%{opacity:.3}}
.paper.drop{box-shadow:0 0 0 2px var(--gold),0 30px 80px -20px rgba(0,0,0,.75)}

.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.seg button{flex:1;height:30px;padding:0 13px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--ivory)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ivory);box-shadow:0 1px 0 var(--line-strong) inset,0 4px 12px -4px rgba(0,0,0,.6)}

.combos{padding:0 20px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.combos .strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(108px,1fr);gap:9px;overflow-x:auto;padding:3px}
.combo{display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border-radius:14px;border:1px solid var(--line);background:rgba(37,24,17,.7);min-width:0;transition:transform .25s var(--ease),border-color .2s}
.combo:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.combo[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.combo .mini{width:46px;height:46px;flex:none;border-radius:10px;padding:2px}
.combo .mini svg{display:block;width:100%;height:100%}
.combo strong{display:block;font:600 15px/1.1 var(--serif);color:var(--ivory)}

aside{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border-left:1px solid var(--line)}
.tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line)}
.tabs button{padding:15px 0 13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ivory)}
.tabs button[aria-pressed="true"]{color:var(--ivory);border-color:var(--gold)}
.pane{flex:1;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--hover) transparent}
.pane>*{flex:none}
.block{display:flex;flex-direction:column;gap:9px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{font-size:12px;font-weight:600;color:var(--gold);padding:2px 0}
.link:hover{color:var(--gold-soft)}

.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.group{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 2px 7px;border-radius:12px;border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);transition:background .2s,border-color .2s}
.group:hover{background:var(--hover)}
.group i,.part i,.current i{border-radius:50%;box-shadow:0 0 0 1px var(--line-strong) inset;flex:none}
.group i{width:24px;height:24px}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.part{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:9px;border:1px solid var(--line);font-size:12px;color:var(--muted);text-align:left}
.part:hover{background:var(--hover)}
.part i{width:15px;height:15px}
.group[aria-pressed="true"],.part[aria-pressed="true"]{border-color:var(--gold);background:var(--raised);color:var(--ivory)}
i.mixed{background:conic-gradient(#914d32,#c6a15b,#5c6740,#914d32)!important}

.editor{border:1px solid var(--line);border-radius:16px;background:var(--raised);padding:13px;display:flex;flex-direction:column;gap:13px}
.current{display:flex;align-items:center;gap:11px;min-width:0}
.current i{width:38px;height:38px;transition:background .3s}
.current div{min-width:0}
.current strong{display:block;font:600 18px/1.15 var(--serif);color:var(--ivory)}
.current small{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.family{display:flex;flex-direction:column;gap:5px}
.family .between span:last-child{font-size:11px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.sw{aspect-ratio:1;width:100%;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;transition:transform .18s var(--ease),box-shadow .18s;touch-action:manipulation}
.sw:hover{transform:translateY(-3px) scale(1.08);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 8px 14px -6px #000}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raised) inset,0 0 0 2px var(--ivory)}
.sv{position:relative;height:172px;border-radius:12px;touch-action:none;cursor:crosshair;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,rgba(255,255,255,0)),var(--hue,#f00)}
.knob{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:linear-gradient(to right,var(--gold) var(--p,50%),rgba(233,216,181,.14) var(--p,50%))}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:linear-gradient(to right,var(--gold) var(--p,50%),rgba(233,216,181,.14) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;background:var(--ivory);border:3px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ivory);border:3px solid var(--gold)}
#hue::-webkit-slider-runnable-track{height:11px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hue::-moz-range-track{height:11px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hue::-webkit-slider-thumb{margin-top:-4px;width:19px;height:19px;background:transparent;border:3px solid #fff}
#hue::-moz-range-thumb{background:transparent;border-color:#fff}
.hexrow{display:flex;gap:8px}
.input{width:100%;min-width:0;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ivory);font-size:16px;font-weight:500;transition:border-color .2s}
.input:focus{border-color:var(--gold);outline:none}
.input::placeholder{color:var(--muted);opacity:.7}
#hex{font-family:ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
.used{display:flex;flex-wrap:wrap;gap:6px}
.used .sw{width:30px}

.field{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:29px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--ivory);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:296px;overflow-y:auto;padding:2px;scrollbar-width:thin;scrollbar-color:var(--hover) transparent}
.font{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px 9px;border-radius:12px;border:1px solid var(--line);min-width:0;text-align:left;transition:background .2s,border-color .2s}
.font:hover{background:var(--hover)}
.font b{font-size:22px;line-height:1.25;color:var(--ivory);white-space:nowrap;max-width:100%;overflow:hidden;font-weight:600}
.font small{font-size:11px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.font[aria-pressed="true"]{border-color:var(--gold);background:var(--raised);box-shadow:0 0 0 1px var(--gold)}
.slider{display:grid;grid-template-columns:104px minmax(0,1fr) 30px;gap:12px;align-items:center;color:var(--muted)}
.slider output{text-align:right;color:var(--ivory);font-variant-numeric:tabular-nums}
.switch{display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--text)}
.switch input{-webkit-appearance:none;appearance:none;width:40px;height:23px;margin:0;border-radius:99px;background:rgba(233,216,181,.16);position:relative;cursor:pointer;transition:background .25s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ivory);transition:transform .25s var(--ease)}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{transform:translateX(17px)}
.switch:has(input:disabled){opacity:.4;cursor:default}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.row{display:flex;gap:8px}
.row>.btn{flex:1}

.saved{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:7px;background:var(--raised);display:flex;flex-direction:column;gap:6px}
.card .thumb{border-radius:9px;padding:5px;aspect-ratio:1;transition:transform .25s var(--ease)}
.card .thumb:hover{transform:scale(1.025)}
.card .thumb svg{display:block;width:100%;height:100%}
.card .between{padding:0 3px;font-size:12px}
.empty{grid-column:1/-1;border:1px dashed var(--line-strong);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:12px}

.mockups{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}
.scene{position:relative;container-type:size;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.scene>span{position:absolute;left:11px;bottom:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#faf4e9;background:rgba(18,11,7,.62);padding:3px 8px;border-radius:99px}
.scene svg{display:block;width:100%;height:100%}
.s-menu{background:linear-gradient(140deg,#4a2b1c,#24150e)}
.menu{width:min(50cqw,62cqh);height:min(70cqw,87cqh);background:var(--m-fill);box-shadow:0 18px 34px -10px #000;padding:5%;display:flex}
.menu div{flex:1;border:1.5px solid var(--m-ink);outline:1px solid var(--m-ink);outline-offset:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7%;color:var(--m-text)}
.menu figure{margin:0;width:72%;aspect-ratio:1}
.menu b{font:600 min(6cqw,7.5cqh)/1 var(--serif);letter-spacing:.34em;padding-left:.34em}
.s-bag{background:linear-gradient(160deg,#e5d1b0,#b39a77)}
.bag{position:relative;width:min(48cqw,60cqh);height:min(58cqw,72cqh);margin-top:6cqh;background:linear-gradient(90deg,#a9794f 0 9%,#c49a76 9% 91%,#b3845a 91%);border-radius:3px 3px 8px 8px;box-shadow:0 22px 30px -14px rgba(44,26,18,.75);display:grid;place-items:center}
.bag::before{content:"";position:absolute;left:30%;right:30%;bottom:100%;height:22%;border:3px solid #70452f;border-bottom:0;border-radius:99px 99px 0 0}
.bag::after{content:"";position:absolute;left:0;right:0;top:0;height:11%;background:rgba(60,32,18,.14);border-bottom:1px solid rgba(60,32,18,.25)}
.bag figure{margin:6% 0 0;width:70%;aspect-ratio:1;filter:drop-shadow(0 3px 5px rgba(44,26,18,.35))}
.s-card{background:linear-gradient(150deg,#8b9068,#414b32)}
.bcard{position:absolute;width:min(58cqw,88cqh);aspect-ratio:1.75;border-radius:6px;box-shadow:0 16px 28px -12px rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center}
.bcard.back{background:var(--m-ink);transform:translate(-25%,-34%) rotate(-8deg);justify-content:flex-start;padding-left:5%}
.bcard.back figure{margin:0;height:66%;aspect-ratio:1}
.bcard.front{background:var(--m-fill);color:var(--m-text);transform:translate(22%,32%) rotate(5deg);flex-direction:column;gap:5%}
.bcard.front b{font:700 min(6cqw,9cqh)/1 var(--serif)}
.bcard.front em{font:700 min(2.4cqw,3.6cqh)/1 var(--sans);font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--m-tree)}
.s-social{background:linear-gradient(145deg,#a65c38,#682f22)}
.profile{width:min(64cqw,82cqh);background:var(--m-fill);color:var(--m-text);border-radius:14px;box-shadow:0 18px 32px -12px rgba(0,0,0,.7);padding:4.5% 4.5% 5%;display:flex;flex-direction:column;align-items:center;gap:min(2cqw,2.6cqh)}
.profile figure{margin:0;width:38%;aspect-ratio:1;border-radius:50%;padding:2px;border:2px solid var(--m-tree)}
.profile b{font:700 min(5.4cqw,6.8cqh)/1 var(--serif)}
.profile div{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
.profile div i{aspect-ratio:1.5;border-radius:4px;background:var(--m-ink)}
.profile div i:nth-child(2){background:var(--m-tree)}
.profile div i:nth-child(3){background:var(--m-text)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,12px);background:var(--ivory);color:#2c1a12;font-weight:700;padding:11px 18px;border-radius:99px;box-shadow:0 14px 34px -10px #000;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#measure{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}

@media (min-width:901px) and (min-height:620px){ .shell{height:100%;overflow:hidden} }
@media (max-width:900px){
  main{display:flex;flex-direction:column}
  .stagecol{display:contents}
  .viewer{flex:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1c110b;border-bottom:1px solid var(--line);box-shadow:0 14px 24px -18px #000}
  .toolbar{padding:10px 16px 0}
  .frame{flex:none;height:min(92vw,40vh);min-height:0;margin:10px 16px 12px}
  .combos{padding:16px 16px 4px;background:var(--bg)}
  .combos .strip{grid-auto-columns:150px}
  aside{border-left:0;overflow:visible}
  .pane{overflow:visible;padding-inline:16px}
  .tabs{padding:0 16px}
  .meters{display:none}
  .mockups{gap:7px}
  .scene>span{display:none}
}
@media (max-width:560px){
  header{padding-inline:16px}
  .brand svg{width:34px;height:34px}
  .brand b{font-size:18px}
  .brand span,#reset span{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<div class="shell">
  <header>
    <div class="brand">

$('#hue').oninput = e => { dragging = true; hsv.h = +e.target.value; setColor(fromHsv(hsv)); dragging = false };
$('#hex').oninput = e => { if (e.target.value.replace('#','').length === 6 && hex(e.target.value)) setColor(hex(e.target.value)) };
$('#hex').onchange = e => { const v = hex(e.target.value); if (v) setColor(v); e.target.value = state.c[keysOf(selected)[0]].toUpperCase() };
if (window.EyeDropper && window.top === window) {
  $('#dropper').hidden = false;
  $('#dropper').onclick = () => new EyeDropper().open().then(r => { const v = hex(r.sRGBHex); if (v) setColor(v) }).catch(()=>{});
}

// Live preview while hovering a swatch, and drag a swatch onto the artwork.
const aside = $('aside');
aside.addEventListener('pointerover', e => {
  const s = e.target.closest('.sw'); if (!s || e.pointerType !== 'mouse' || view !== 'logo') return;
  const c = {...state.c}; for (const k of keysOf(selected)) c[k] = s.dataset.color; paint(c);
});
aside.addEventListener('pointerout', e => { if (e.target.closest('.sw') && view === 'logo') paint(state.c) });
document.addEventListener('dragstart', e => { const s = e.target.closest?.('.sw'); if (s) e.dataTransfer.setData('text/plain', s.dataset.color) });
const stage = $('#stage');
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drop') });
stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
stage.addEventListener('drop', e => {
  e.preventDefault(); stage.classList.remove('drop');
  const v = hex(e.dataTransfer.getData('text/plain')); if (!v) return;
  const part = e.target.closest('[data-part]')?.dataset.part || 'canvas';
  setColor(v,part); toast(`${colorName(v)} applied to ${PART_NAMES[part].toLowerCase()}`);
});
stage.addEventListener('click', e => {
  const part = e.target.closest('[data-part]')?.dataset.part || 'canvas';
  showTab('color');
  if (!['tree','canvas'].includes(part)) showParts(true);
  select(part);
});

const compare = $('#compare');
const setCompare = on => { if (comparing !== on) { comparing = on; schedule() } };
compare.onpointerdown = e => { compare.setPointerCapture(e.pointerId); setCompare(true) };
compare.onpointerup = compare.onpointercancel = compare.onblur = () => setCompare(false);
compare.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') setCompare(true) };
compare.onkeyup = () => setCompare(false);

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.target.matches('input:not([type=range]):not([type=checkbox]),textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'z') { e.preventDefault(); travel(!e.shiftKey) } else if (k === 'y') { e.preventDefault(); travel(false) }
});
document.fonts.addEventListener('loadingdone', refreshFonts);

buildColorPanel(); buildFonts(); syncAll(); drawSaved(); syncHistory(); saved.forEach(useFonts);
Object.keys(FONTS).forEach(f => ensureFont(f));
})();
</script>

</body>
</html>
